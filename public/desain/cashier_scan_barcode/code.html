<div class="absolute inset-x-0 top-0 h-[2px] bg-primary scanner-line shadow-[0_0_8px_rgba(0,0,0,0.5)]"></div>
<div class="flex flex-col items-center gap-2 opacity-50">
<span class="material-symbols-outlined text-[48px]">qr_code_scanner</span>
<span class="text-label-caps font-label-caps">Area Pindai</span>
</div>

<div class="absolute top-4 left-4 w-6 h-6 border-t-4 border-l-4 border-primary rounded-tl"></div>
<div class="absolute top-4 right-4 w-6 h-6 border-t-4 border-r-4 border-primary rounded-tr"></div>
