<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>NORD CAFE - Cashier Pesanan Masuk</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#dbdad9",
                    "on-secondary": "#ffffff",
                    "surface-bright": "#fbf9f8",
                    "on-secondary-container": "#6f2e00",
                    "secondary": "#99460d",
                    "tertiary-fixed": "#e6e2df",
                    "status-unpaid": "#6B6B6B",
                    "secondary-fixed-dim": "#ffb68f",
                    "on-tertiary-fixed-variant": "#484645",
                    "surface-variant": "#e4e2e2",
                    "status-completed": "#10B981",
                    "on-secondary-fixed-variant": "#773200",
                    "background-warm": "#F5EBDD",
                    "inverse-primary": "#c8c6c5",
                    "error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#cac6c4",
                    "on-tertiary-container": "#868382",
                    "outline": "#747878",
                    "surface-container-high": "#e9e8e7",
                    "on-error-container": "#93000a",
                    "on-surface": "#1b1c1c",
                    "surface-container-low": "#f5f3f3",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#f2f0f0",
                    "status-processing": "#F59E0B",
                    "error": "#ba1a1a",
                    "on-background": "#1b1c1c",
                    "surface": "#fbf9f8",
                    "background": "#fbf9f8",
                    "on-error": "#ffffff",
                    "outline-variant": "#c4c7c7",
                    "tertiary": "#000000",
                    "on-primary-fixed-variant": "#474746",
                    "primary-fixed-dim": "#c8c6c5",
                    "surface-tint": "#5f5e5e",
                    "secondary-fixed": "#ffdbca",
                    "primary": "#000000",
                    "surface-container-highest": "#e4e2e2",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#fd9356",
                    "primary-fixed": "#e5e2e1",
                    "on-tertiary-fixed": "#1c1b1a",
                    "on-primary-container": "#858383",
                    "surface-container": "#efeded",
                    "primary-container": "#1c1b1b",
                    "on-surface-variant": "#444748",
                    "tertiary-container": "#1c1b1a",
                    "on-primary-fixed": "#1c1b1b",
                    "on-secondary-fixed": "#331100",
                    "inverse-surface": "#303031"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit-xl": "40px",
                    "gutter": "16px",
                    "margin-mobile": "20px",
                    "unit-sm": "8px",
                    "unit-xs": "4px",
                    "unit-lg": "24px",
                    "unit-md": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-secondary": ["Inter"],
                    "headline-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-secondary": ["14px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}]
            }
          },
        }
      }
    </script>
<style>
        body {
            background-color: #F5EBDD; /* Warm Cream background */
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        
        /* Custom Scrollbar for sleekness */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface antialiased overflow-x-hidden min-h-screen flex flex-col relative">
<!-- TopAppBar (Cashier) -->
<header class="bg-surface-container-lowest border-b border-on-surface/5 shadow-sm sticky top-0 z-40 pt-safe">
<div class="flex justify-between items-center w-full px-margin-mobile h-16 max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">point_of_sale</span>
<h1 class="text-headline-md font-headline-md font-bold text-on-surface tracking-tight">NORD CAFE - Kasir</h1>
</div>
<div class="flex items-center justify-center w-10 h-10 bg-surface-variant rounded-full border border-on-surface/10 hover:bg-surface-variant/20 transition-colors">
<span class="text-label-caps font-label-caps text-on-surface">A2</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile pt-unit-lg pb-[100px] max-w-2xl mx-auto w-full flex flex-col gap-unit-md">
<!-- Header Section -->
<section class="mb-unit-sm">
<h2 class="text-headline-lg font-headline-lg text-on-surface mb-1">Pesanan Masuk</h2>
<p class="text-body-secondary font-body-secondary text-status-unpaid">Kelola dan proses order aktif</p>
</section>
<!-- Order List (Bento-inspired List) -->
<section class="flex flex-col gap-unit-md">
<!-- Card 1: SUDAH DIBAYAR -->
<article class="bg-surface-container-lowest rounded-2xl p-4 shadow-[0px_4px_12px_rgba(26,26,26,0.05)] border border-on-surface/5 relative overflow-hidden group hover:-translate-y-0.5 transition-transform duration-300">
<!-- Status Row -->
<div class="flex justify-between items-start mb-3">
<div class="flex items-center gap-2">
<span class="text-label-caps font-label-caps text-on-surface tracking-wider">MEJA 04</span>
</div>
<div class="bg-primary text-on-primary px-3 py-1.5 rounded-full text-[10px] font-bold tracking-widest uppercase">
                        SUDAH DIBAYAR
                    </div>
</div>
<!-- Order Details -->
<div class="flex flex-col mb-4">
<span class="text-headline-sm font-headline-sm text-on-surface">ORD-012</span>
<div class="flex items-center gap-2 mt-1">
<span class="text-body-secondary font-body-secondary text-status-unpaid">2 Item</span>
<span class="w-1 h-1 rounded-full bg-status-unpaid/50"></span>
<span class="text-body-lg font-body-lg font-bold text-on-surface">Rp56.000</span>
</div>
</div>
<!-- Actions -->
<div class="flex gap-2 items-center w-full">
<button class="flex-1 bg-primary text-on-primary py-3 rounded-xl font-bold text-sm hover:opacity-90 transition-opacity active:scale-[0.98] flex justify-center items-center gap-2">
                        Proses Pesanan
                    </button>
<button class="w-12 h-12 bg-transparent border border-primary/20 text-primary rounded-xl flex items-center justify-center hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</button>
</div>
</article>
<!-- Card 2: SEDANG DIPROSES -->
<article class="bg-surface-container-lowest rounded-2xl p-4 shadow-[0px_4px_12px_rgba(26,26,26,0.05)] border border-on-surface/5 relative overflow-hidden group hover:-translate-y-0.5 transition-transform duration-300">
<!-- Status Row -->
<div class="flex justify-between items-start mb-3">
<div class="flex items-center gap-2">
<span class="text-label-caps font-label-caps text-on-surface tracking-wider flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">shopping_bag</span>
                            TAKEAWAY
                        </span>
</div>
<div class="bg-status-processing text-on-primary px-3 py-1.5 rounded-full text-[10px] font-bold tracking-widest uppercase shadow-[0_2px_8px_rgba(245,158,11,0.2)]">
                        SEDANG DIPROSES
                    </div>
</div>
<!-- Order Details -->
<div class="flex flex-col mb-4">
<span class="text-headline-sm font-headline-sm text-on-surface">ORD-013</span>
<div class="flex items-center gap-2 mt-1">
<span class="text-body-secondary font-body-secondary text-status-unpaid">1 Item — Rp32.000</span>
</div>
</div>
<!-- Actions -->
<div class="flex gap-2 items-center w-full">
<button class="flex-1 bg-status-completed text-on-primary py-3 rounded-xl font-bold text-sm hover:brightness-110 transition-all active:scale-[0.98] shadow-[0_4px_12px_rgba(16,185,129,0.2)]">
                        Tandai Selesai
                    </button>
<button class="w-12 h-12 bg-transparent border border-primary/20 text-primary rounded-xl flex items-center justify-center hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</button>
</div>
</article>
<!-- Card 3: SELESAI (Muted state) -->
<article class="bg-surface-container-lowest/60 rounded-2xl p-4 border border-on-surface/5 opacity-70 filter grayscale-[20%]">
<!-- Status Row -->
<div class="flex justify-between items-start mb-3">
<div class="flex items-center gap-2">
<span class="text-label-caps font-label-caps text-status-unpaid tracking-wider">MEJA 12</span>
</div>
<div class="bg-status-completed/20 text-status-completed px-3 py-1.5 rounded-full text-[10px] font-bold tracking-widest uppercase border border-status-completed/30">
                        SELESAI
                    </div>
</div>
<!-- Order Details -->
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="text-headline-sm font-headline-sm text-status-unpaid line-through decoration-1">ORD-014</span>
</div>
<button class="w-10 h-10 bg-transparent text-status-unpaid rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</button>
</div>
</article>
</section>
</main>
<!-- BottomNavBar (Cashier) -->
<nav class="bg-surface-container-lowest border-t border-on-surface/10 shadow-lg fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 py-2 pb-safe md:hidden">
<!-- Pindai (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant pt-1 hover:bg-surface-variant/10 w-20 h-14 rounded-lg transition-colors">
<span class="material-symbols-outlined mb-1 text-[24px]">qr_code_scanner</span>
<span class="text-label-caps font-label-caps">Pindai</span>
</button>
<!-- Pesanan Masuk (Active) -->
<button class="flex flex-col items-center justify-center text-primary font-bold border-t-2 border-primary pt-1 w-24 h-14 scale-95 transition-transform duration-150 relative">
<div class="absolute -top-1.5 right-4 w-3 h-3 bg-status-processing rounded-full border-2 border-surface-container-lowest animate-pulse"></div>
<span class="material-symbols-outlined mb-1 text-[24px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pending_actions</span>
<span class="text-label-caps font-label-caps whitespace-nowrap">Pesanan Masuk</span>
</button>
<!-- Riwayat (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant pt-1 hover:bg-surface-variant/10 w-20 h-14 rounded-lg transition-colors">
<span class="material-symbols-outlined mb-1 text-[24px]">history</span>
<span class="text-label-caps font-label-caps">Riwayat</span>
</button>
</nav>
<!-- Desktop Sidebar mapping for wider screens (hidden md:flex) -->
<aside class="hidden md:flex flex-col w-64 bg-surface-container-lowest h-screen fixed left-0 top-0 border-r border-on-surface/5 pt-20 px-4 gap-2 z-30 shadow-[4px_0_12px_rgba(26,26,26,0.02)]">
<button class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant/20 rounded-xl transition-colors w-full text-left">
<span class="material-symbols-outlined">qr_code_scanner</span>
<span class="font-body-md font-semibold">Pindai</span>
</button>
<button class="flex items-center gap-3 px-4 py-3 text-primary bg-primary/5 rounded-xl transition-colors w-full text-left relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary rounded-r-md"></div>
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pending_actions</span>
<span class="font-body-md font-bold">Pesanan Masuk</span>
<div class="ml-auto bg-status-processing text-on-primary text-[10px] font-bold px-2 py-0.5 rounded-full">2</div>
</button>
<button class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant/20 rounded-xl transition-colors w-full text-left">
<span class="material-symbols-outlined">history</span>
<span class="font-body-md font-semibold">Riwayat</span>
</button>
</aside>
<!-- Add padding to main content on desktop to account for sidebar -->
<style>
        @media (min-width: 768px) {
            main { margin-left: 16rem; max-width: calc(100% - 16rem); padding-left: 2rem; padding-right: 2rem; }
        }
    </style>
</body></html>
