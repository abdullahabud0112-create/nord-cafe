<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="nordBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E9DC"/>
      <stop offset="55%" stop-color="#E7D7C3"/>
      <stop offset="100%" stop-color="#D9C3A8"/>
    </linearGradient>
    <linearGradient id="crema" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C89B6A"/>
      <stop offset="100%" stop-color="#9C6B3C"/>
    </linearGradient>
    <radialGradient id="softLight" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6B4A2B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#nordBg)"/>
  <rect width="400" height="300" fill="url(#softLight)"/>

  <!-- Latte cup with saucer -->
  <g filter="url(#softShadow)" transform="translate(200 150)">
    <!-- Saucer -->
    <ellipse cx="0" cy="62" rx="92" ry="18" fill="#F7F1E8"/>
    <ellipse cx="0" cy="58" rx="92" ry="18" fill="#FFFFFF"/>
    <!-- Cup body -->
    <path d="M-58 -40 L-48 34 Q0 58 48 34 L58 -40 Z" fill="#FFFFFF"/>
    <path d="M-58 -40 L-52 8 Q0 30 52 8 L58 -40 Z" fill="#FBF7F1"/>
    <!-- Coffee surface -->
    <ellipse cx="0" cy="-40" rx="58" ry="16" fill="#5C3A21"/>
    <ellipse cx="0" cy="-41" rx="52" ry="13" fill="url(#crema)"/>
    <!-- Latte art heart -->
    <path d="M0 -34 C -6 -44, -20 -44, -20 -34 C -20 -26, -8 -22, 0 -16 C 8 -22, 20 -26, 20 -34 C 20 -44, 6 -44, 0 -34 Z"
          fill="#F7EFE4" opacity="0.92"/>
    <!-- Handle -->
    <path d="M56 -26 Q88 -24 86 2 Q84 26 54 24" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <!-- Steam -->
    <g stroke="#9C6B3C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45">
      <path d="M-22 -70 Q-28 -84 -22 -96"/>
      <path d="M0 -76 Q-6 -92 0 -106"/>
      <path d="M22 -70 Q16 -84 22 -96"/>
    </g>
  </g>

  <!-- Brand typography -->
  <text x="200" y="258"
        text-anchor="middle"
        fill="#4A3222"
        font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif"
        font-size="15"
        font-weight="700"
        letter-spacing="5">
    NORD CAFE
  </text>
  <text x="200" y="280"
        text-anchor="middle"
        fill="#8A6A4C"
        font-family="Inter, -apple-system, sans-serif"
        font-size="10"
        font-weight="500"
        letter-spacing="2.5">
    COFFEE &amp; EATERY
  </text>
</svg>
